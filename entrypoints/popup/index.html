<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --brand-gradient: linear-gradient(135deg, #2fa252 0%, #52a8c9 100%);
        --emerald: #2fa252;
        --slate: #1f2937;
        --gray: #6b7280;
        --bg: #f9fafb;
      }

      body {
        font-family: 'Outfit', sans-serif;
        margin: 0;
        padding: 0;
        width: 320px;
        background: var(--brand-gradient);
        color: var(--slate);
        min-height: 200px;
      }

      .container {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        margin-bottom: 4px;
      }

      .header h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 18px;
        margin: 0;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: transform 0.2s ease-in-out;
      }

      .card:hover {
        transform: scale(1.02);
      }

      .card-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--gray);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .card-text {
        font-size: 12px;
        line-height: 1.5;
        color: var(--slate);
      }

      .product-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .price-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        color: var(--gray);
      }

      .caption {
        font-size: 10px;
        line-height: 1.5;
        color: var(--gray);
      }

      .price-delta {
        font-size: 12px;
        font-weight: 600;
      }

      .price-delta.down {
        color: var(--emerald);
      }

      .price-delta.up {
        color: var(--slate);
      }

      .price-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .current-price {
        font-size: 20px;
        font-weight: 600;
        color: var(--slate);
      }

      .btn-portal {
        background: var(--emerald);
        color: white;
        text-decoration: none;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s;
      }

      .btn-portal:hover {
        filter: brightness(1.1);
      }

      .footer {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="/icon/32.png" alt="PH" width="24" height="24" />
      </div>

      <div class="card">
        <div class="card-title" data-state="loading">Checking…</div>
        <div class="card-text" data-state="pdp-untracked" hidden>Not tracked yet — open this page to record it</div>
        <div class="card-text" data-state="search" hidden>Search page — tracking results as you scroll</div>
        <div class="card-text" data-state="wishlist" hidden>Wishlist — tracking saved items</div>
        <div class="card-text" data-state="tokopedia-other" hidden>Tokopedia page — no price to track here</div>
        <div class="card-text" data-state="not-tokopedia" hidden>Not a Tokopedia page</div>
        <div class="card-text" data-state="error" hidden>Couldn't read price data</div>
        <div class="product-block" data-state="pdp-tracked" hidden>
          <div class="card-title">Current</div>
          <div class="price-row">
            <span class="current-price" data-field="current">—</span>
            <span class="price-delta" data-field="delta" hidden></span>
          </div>
          <div class="price-meta">
            <span class="card-title">Lowest</span>
            <span data-field="lowest">—</span>
          </div>
          <div class="caption" data-field="records">—</div>
        </div>
        <div class="caption" data-field="pending" hidden></div>
      </div>

      <a href="https://pricehistory.id" target="_blank" class="btn-portal">
        Open Dashboard
      </a>

      <div class="footer">
        Part of the PriceHistory.id ecosystem
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
